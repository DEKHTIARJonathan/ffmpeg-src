[package]
name = "ffmpeg-src-smoke"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format", "software-scaling"] }
ffmpeg-sys-next = { version = "=9.0.1", default-features = false }

[features]
default = ["filter"]
filter = ["ffmpeg-next/filter"]
static = ["ffmpeg-next/static"]

[workspace]

[build-dependencies]
cc = "1"
pkg-config = "0.3"

# Direct requirement intentionally constrains the binding version under test.
[package.metadata.cargo-machete]
ignored = ["ffmpeg-sys-next"]
