name: Release
on:
  pull_request:
  push:
    branches: [master]
    tags: ['n8.0', 'n8.0-rc*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  RUSTC_WRAPPER: sccache
  FFMPEG_SRC_REQUIRE_SCCACHE: '1'
  CARGO_INCREMENTAL: '0'
jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: python scripts/setup.py
      - uses: cargo-bins/cargo-binstall@v1.26.1
      - run: cargo binstall --locked --no-confirm --disable-strategies compile cargo-audit@0.22.2 cargo-deny@0.20.2 cargo-machete@0.9.2
      - uses: j178/prek-action@v3.1.0
        with:
          prek-version: '0.5.5'
      - run: cargo fmt --manifest-path testcrate/Cargo.toml --check
      - run: make check-version
  package:
    needs: pre-commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: python scripts/setup.py
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: dist/*.crate
          if-no-files-found: error
  smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        features: ['', 'enable-gpl,kvazaar', 'static', 'static,enable-gpl,kvazaar', 'enable-version3']
        include:
          - os: ubuntu-24.04
            features: kvazaar,vaapi
          - os: macos-15
            features: kvazaar,videotoolbox
          - os: windows-2025
            features: kvazaar,d3d11va,dxva2,static-crt
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: python scripts/setup.py
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm ninja-build pkg-config libclang-dev libva-dev libdrm-dev
      - if: runner.os == 'macOS'
        run: brew install ninja pkg-config
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - if: runner.os == 'Windows'
        run: python scripts/rustc_cache.py setup
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys
        with:
          path-type: inherit
          install: make nasm pkgconf diffutils
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: dist
      - uses: actions/cache@v4
        with:
          path: .cache/sccache
          key: sccache-${{ runner.os }}-${{ runner.arch }}-${{ strategy.job-index }}-${{ hashFiles('Cargo.lock', 'scripts/*.py', 'scripts/*.rs', '.gitmodules', '.github/workflows/release.yml') }}
      - if: runner.os == 'Windows'
        run: python scripts/rustc_cache.py test
      - run: python scripts/verify.py
        env:
          FEATURES: ${{ matrix.features }}
          FFMPEG_SRC_MSYS_BIN: ${{ steps.msys.outputs.msys2-location }}/usr/bin
      - if: always()
        run: sccache --show-stats
  publish:
    if: github.ref_type == 'tag'
    needs: smoke
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: python scripts/setup.py
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: dist
      - name: Validate tag and identical repackaging
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          expected=n8.0
          case "$version" in *-rc*) expected="n8.0-${version#*-}";; esac
          test "$GITHUB_REF_NAME" = "$expected"
          mkdir -p target/publication
          tar -xf dist/*.crate -C target/publication --strip-components=1
          mv target/publication/Cargo.toml.orig target/publication/Cargo.toml
          cargo package --manifest-path target/publication/Cargo.toml --locked --no-verify
          cmp dist/*.crate target/publication/target/package/*.crate
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --manifest-path target/publication/Cargo.toml --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  verify:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: dist
      - run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          mkdir -p target
          curl -fL --retry 12 --retry-all-errors --retry-delay 10 "https://static.crates.io/crates/ffmpeg-src/ffmpeg-src-$version.crate" -o target/registry.crate
          cmp dist/*.crate target/registry.crate
