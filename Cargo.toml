[package]
name = "ffmpeg-src"
version = "8.0.0"
edition = "2021"
license-file = "LICENSE.md"
description = "Pristine FFmpeg sources and configurable native SDK builds"
repository = "https://github.com/DEKHTIARJonathan/ffmpeg-src"
links = "ffmpeg_src"
include = ["src", "build.rs", "scripts/native.py", "scripts/pkg_config.py", "scripts/pkg_config.cmd", "native", "README.md", "LICENSE.md"]

[features]
default = ["avdevice", "avfilter", "avformat", "swscale", "swresample", "shared", "zlib", "asm", "network"]
avutil = []
avcodec = ["avutil"]
avformat = ["avcodec"]
avdevice = ["avformat"]
avfilter = ["avutil"]
swscale = ["avutil"]
swresample = ["avutil"]
shared = []
static = []
zlib = []
kvazaar = ["avcodec"]
videotoolbox = ["avcodec"]
vaapi = ["avcodec"]
d3d11va = ["avcodec"]
dxva2 = ["avcodec"]
asm = []
network = []
enable-gpl = ["avfilter"]
enable-version3 = []
static-crt = []

[workspace]
exclude = ["testcrate", "target"]
